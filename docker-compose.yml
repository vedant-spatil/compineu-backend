# Local development: Postgres only. The API and the frontend run on the host (see markdown/runbook.md).
# POSTGRES_PASSWORD comes from .env (copy .env.example). The volume name is new on purpose: an older volume holds a
# database created under another name and Postgres does not re-initialise a non-empty volume.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: compineu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: compineu
    ports:
      - "5432:5432"
    volumes:
      - compineu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compineu -d compineu"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  compineu_pgdata:
