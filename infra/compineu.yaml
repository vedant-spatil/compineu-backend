AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  compineu stack, reusable in any AWS account and region. One EC2 box behind CloudFront, private S3 buckets,
  an Object Lock evidence bucket and a least-privilege instance role. No SSH: shell access is through SSM.
  The LLM is Groq (an API key kept in SSM Parameter Store), so the role carries no model permissions.
  Deploy with infra/deploy.sh, which creates the secrets in SSM Parameter Store and fills the network parameters.
  Leave VpcId empty to have the stack create its own VPC (for accounts without a default VPC).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [Project]
      - Label: { default: Compute }
        Parameters: [InstanceType, VolumeSizeGb, AmiId]
      - Label: { default: Network (leave VpcId and SubnetId empty to create a VPC) }
        Parameters: [VpcId, SubnetId, AvailabilityZone, CloudFrontPrefixList]
      - Label: { default: Security and retention }
        Parameters: [OriginSecret, EvidenceRetentionDays, LogRetentionDays, PriceClass]

Parameters:
  Project:
    Type: String
    Default: compineu
    AllowedPattern: "^[a-z][a-z0-9-]{2,19}$"
    Description: >-
      Name prefix for every resource and the SSM path /<Project>/prod. Use a different value to run two copies in
      one account and region.
  InstanceType:
    Type: String
    Default: t3a.large
    Description: 8 GB RAM is the comfortable minimum (Postgres, the API with spaCy, nginx). x86_64 only (the AMI is amd64).
  VolumeSizeGb:
    Type: Number
    Default: 30
    MinValue: 20
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  VpcId:
    Type: String
    Default: ""
    Description: Existing VPC (for example the default VPC). Empty creates a new VPC with one public subnet.
  SubnetId:
    Type: String
    Default: ""
    Description: A public subnet in VpcId. Required when VpcId is set.
  AvailabilityZone:
    Type: String
    Default: ""
    Description: AZ for the created subnet. Empty picks the region's first AZ. deploy.sh picks one that offers InstanceType.
  CloudFrontPrefixList:
    Type: String
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: >-
      Id of the managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region (it differs per
      region). deploy.sh looks it up.
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Sent by CloudFront as X-Origin-Verify; nginx rejects requests without it.
  EvidenceRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >-
      Object Lock COMPLIANCE retention. Nobody, not even root, can delete evidence before it ends, so keep it short
      for demos (1) and long for production (365).
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_200 includes India and most of Asia; PriceClass_100 is North America and Europe only.

Rules:
  SubnetComesWithVpc:
    RuleCondition: !Not [!Equals [!Ref VpcId, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref SubnetId, ""]]
        AssertDescription: SubnetId is required when VpcId is set.

Conditions:
  CreateVpc: !Equals [!Ref VpcId, ""]
  AzGiven: !Not [!Equals [!Ref AvailabilityZone, ""]]
  UsEast1: !Equals [!Ref "AWS::Region", us-east-1]   # EC2 public DNS there is ec2-...compute-1.amazonaws.com

Resources:
  # ---------------------------------------------------------------- network (only when no VPC is given)
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true          # CloudFront reaches the box through its public DNS name
      Tags: [{ Key: Name, Value: !Ref Project }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags: [{ Key: Name, Value: !Ref Project }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !If [AzGiven, !Ref AvailabilityZone, !Select [0, !GetAZs ""]]
      MapPublicIpOnLaunch: true         # the box needs internet for apt and Docker before its Elastic IP attaches
      Tags: [{ Key: Name, Value: !Sub "${Project}-public" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-public" }]

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # DependsOn cannot point at a conditional resource, so the box waits on this handle, which references the route
  # only when the stack builds the VPC.
  NetworkReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Route: !If [CreateVpc, !Ref DefaultRoute, none]
      Association: !If [CreateVpc, !Ref PublicSubnetRoutes, none]

  # ---------------------------------------------------------------- logs
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${Project}/prod
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------- buckets (names carry account and region: unique)
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # compliance-mode objects cannot be deleted before retention ends, by anyone
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${Project}-evidence-${AWS::AccountId}-${AWS::Region}
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: !Ref EvidenceRetentionDays
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Project}-web-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Project}-artifacts-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules: [{ Id: expire, Status: Enabled, ExpirationInDays: 7 }]

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt EvidenceBucket.Arn, !Sub "${EvidenceBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ArtifactsBucket.Arn, !Sub "${ArtifactsBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }
          - Sid: CloudFrontReadOnly      # only this distribution, through Origin Access Control
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------- instance role (no access keys on the box)
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Project}-ec2-${AWS::Region}      # IAM is global: the region keeps two regions apart
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore   # Session Manager + Run Command
      Policies:
        - PolicyName: !Sub ${Project}-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EvidenceWriteNoDelete
                Effect: Allow
                Action: [s3:PutObject, s3:PutObjectRetention, s3:GetObject, s3:GetObjectRetention, s3:GetObjectVersion]
                Resource: !Sub "${EvidenceBucket.Arn}/*"
              - Sid: EvidenceList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt EvidenceBucket.Arn
              - Sid: NeverDeleteEvidence
                Effect: Deny
                Action: [s3:DeleteObject, s3:DeleteObjectVersion, s3:BypassGovernanceRetention, s3:PutBucketObjectLockConfiguration]
                Resource: [!GetAtt EvidenceBucket.Arn, !Sub "${EvidenceBucket.Arn}/*"]
              - Sid: ReadDeployArtifacts
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: ReadOwnSecrets
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/*
              - Sid: DecryptSecretsViaSsmOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition: { StringEquals: { kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com" } }
              - Sid: LogsWrite
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${LogGroup.Arn}"
              - Sid: LogsQueryForObservabilityPage
                Effect: Allow
                Action: [logs:StartQuery, logs:StopQuery, logs:GetQueryResults, logs:DescribeLogGroups]
                Resource: "*"
              - Sid: HostMetricsFromCloudWatchAgent      # scripts/aws/03-cw-agent.sh; only the compineu namespaces
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { "cloudwatch:namespace": ["compineu/EC2"] } }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${Project}-ec2-${AWS::Region}
      Roles: [!Ref InstanceRole]

  # ---------------------------------------------------------------- the box: only CloudFront may reach it
  BoxSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${Project}-box
      GroupDescription: HTTP from CloudFront origin-facing IPs only. No SSH.
      VpcId: !If [CreateVpc, !Ref Vpc, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixList
          Description: CloudFront origin-facing
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "AWS APIs, apt, Docker Hub" }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: apt mirrors }
        - { IpProtocol: udp, FromPort: 123, ToPort: 123, CidrIp: 0.0.0.0/0, Description: NTP }

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${Project}-box
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only
          HttpPutResponseHopLimit: 2    # containers need one extra hop to reach the instance role credentials
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: { VolumeSize: !Ref VolumeSizeGb, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }

  Box:
    Type: AWS::EC2::Instance
    DependsOn: NetworkReady
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !If [CreateVpc, !Ref PublicSubnet, !Ref SubnetId]
      SecurityGroupIds: [!Ref BoxSecurityGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Sub "${Project}-box" }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # First boot only. Ubuntu 24.04 ships the SSM agent (snap), so Session Manager works without SSH.
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! swapon --show | grep -q /swapfile; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          apt-get update -y
          apt-get install -y ca-certificates curl git jq unzip
          command -v docker || curl -fsSL https://get.docker.com | sh
          usermod -aG docker ubuntu
          systemctl enable --now docker
          snap install aws-cli --classic || true
          mkdir -p /opt/compineu && chown ubuntu:ubuntu /opt/compineu
          echo ready > /opt/compineu/.bootstrapped

  BoxIp:
    Type: AWS::EC2::EIP
    DependsOn: NetworkReady
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-box" }]

  BoxIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt BoxIp.AllocationId
      InstanceId: !Ref Box

  # ---------------------------------------------------------------- CloudFront: one origin for the page and /api
  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${Project}-web-oac-${AWS::Region}     # CloudFront names are account-wide
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # React routes -> /index.html on the S3 behaviour only. A distribution-wide custom error page would also turn the
  # API's 403 (PB1 suspended agent) into index.html, which is the moment the demo needs to show.
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${Project}-spa-rewrite-${AWS::Region}
      AutoPublish: true
      FunctionConfig: { Comment: SPA routes to index.html, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var last = req.uri.split('/').pop();
          if (last.indexOf('.') === -1) { req.uri = '/index.html'; }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: BoxIpAssociation
    Properties:
      DistributionConfig:
        Comment: !Sub ${Project} web + api (${AWS::Region})
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            # CloudFront needs a DNS name, not an IP: the EC2 public DNS name of the Elastic IP.
            DomainName: !If
              - UsEast1
              - !Sub
                - ec2-${Dashed}.compute-1.amazonaws.com
                - Dashed: !Join ["-", !Split [".", !Ref BoxIp]]
              - !Sub
                - ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com
                - Dashed: !Join ["-", !Split [".", !Ref BoxIp]]
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false                                             # keep the SSE stream unbuffered
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer (forwards Authorization)
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  AppUrl:
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  InstanceId:
    Value: !Ref Box
  OriginDns:
    Value: !If
      - UsEast1
      - !Sub
        - ec2-${Dashed}.compute-1.amazonaws.com
        - Dashed: !Join ["-", !Split [".", !Ref BoxIp]]
      - !Sub
        - ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com
        - Dashed: !Join ["-", !Split [".", !Ref BoxIp]]
  WebBucket:
    Value: !Ref WebBucket
  EvidenceBucket:
    Value: !Ref EvidenceBucket
  ArtifactsBucket:
    Value: !Ref ArtifactsBucket
  LogGroup:
    Value: !Ref LogGroup
  SsmPrefix:
    Description: SecureString secrets live under this path (created by deploy.sh, read by the box).
    Value: !Sub /${Project}/prod
